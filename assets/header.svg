<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AD7FF"/>
      <stop offset="0.5" stop-color="#B8A9FF"/>
      <stop offset="1" stop-color="#F4A7B9"/>
    </linearGradient>
    <style>
      .t { font: 800 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
      .d { font: 600 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; opacity: .92; letter-spacing: .5px; }
      .fade { animation: in 1.2s ease-out both; }
      .fade2 { animation: in 1.2s .35s ease-out both; }
      .wave { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <path d="M0 0H1200V190C1080 230 960 160 840 180S600 250 480 220 240 150 120 190 0 210 0 210Z" fill="url(#g)"/>
  <text class="t fade" x="600" y="112" text-anchor="middle">Hey, I'm Koala</text>
  <text class="d fade2" x="600" y="152" text-anchor="middle">Roblox Game &amp; Web Developer · Founder of Severance</text>
</svg>
